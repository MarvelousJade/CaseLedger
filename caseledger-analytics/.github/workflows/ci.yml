name: analytics-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install and verify Python
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check src tests tools
          python -m pytest tests/unit --junitxml=artifacts/unit-tests.xml

      - name: Start data services
        run: docker compose up -d --wait

      - name: Build ETL image
        run: docker compose --profile tools build etl

      - name: Full, incremental, late-arrival, and replay scenario
        run: docker compose --profile tools run --rm etl demo --cases 80

      - name: Failed run must return nonzero
        run: '! docker compose --profile tools run --rm etl simulate-failure --stage stage'

      - name: Publish service logs on failure
        if: failure()
        run: docker compose logs --no-color > artifacts/compose.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caseledger-analytics-verification
          path: artifacts/

      - name: Stop services
        if: always()
        run: docker compose down -v
