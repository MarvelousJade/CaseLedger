name: caseledger-analytics

services:
  source:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caseledger_source
      POSTGRES_USER: caseledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseledger-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-6543}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseledger -d caseledger_source"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./sql/source/000_synthetic_operational_schema.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro
      - ./sql/source/001_export_views.sql:/docker-entrypoint-initdb.d/001_export_views.sql:ro
      - ./sql/source/002_local_permissions.sql:/docker-entrypoint-initdb.d/002_permissions.sql:ro

  warehouse:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-CaseLedger_Analytics_2026!}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-14333}:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    volumes:
      - warehouse-data:/var/opt/mssql

  etl:
    profiles: ["tools"]
    build: .
    environment:
      CASELEDGER_SOURCE_URL: postgresql+psycopg://caseledger_analytics:${SOURCE_ANALYTICS_PASSWORD:-caseledger-analytics-local}@source:5432/caseledger_source
      CASELEDGER_SOURCE_ADMIN_URL: postgresql+psycopg://caseledger:${POSTGRES_PASSWORD:-caseledger-local}@source:5432/caseledger_source
      CASELEDGER_SQLSERVER_HOST: warehouse
      CASELEDGER_SQLSERVER_PORT: "1433"
      CASELEDGER_SQLSERVER_DATABASE: CaseLedgerAnalytics
      CASELEDGER_SQLSERVER_USER: sa
      CASELEDGER_SQLSERVER_PASSWORD: ${SQLSERVER_SA_PASSWORD:-CaseLedger_Analytics_2026!}
      CASELEDGER_SQLSERVER_DRIVER: ODBC Driver 18 for SQL Server
      CASELEDGER_PIPELINE_NAME: caseledger-python-incremental
      CASELEDGER_LOG_LEVEL: INFO
    depends_on:
      source:
        condition: service_healthy
      warehouse:
        condition: service_healthy

volumes:
  source-data:
  warehouse-data:
