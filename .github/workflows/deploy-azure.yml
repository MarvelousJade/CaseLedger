name: Deploy Azure environment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or deploy them
        required: true
        type: choice
        default: plan
        options:
          - plan
          - deploy
      environment_name:
        description: Logical deployment environment
        required: true
        type: choice
        default: staging
        options:
          - dev
          - staging
          - prod
      image_sha:
        description: Published 40-character commit SHA; blank uses this workflow commit
        required: false
        type: string

permissions: {}

concurrency:
  group: caseledger-azure-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment_name == 'prod' && 'azure-production' || format('azure-{0}', inputs.environment_name) }}
    permissions:
      contents: read
      id-token: write
    env:
      CASELEDGER_AUTHENTICATION_MODE: ${{ vars.CASELEDGER_AUTHENTICATION_MODE }}
      CASELEDGER_ENTRA_TENANT_ID: ${{ vars.CASELEDGER_ENTRA_TENANT_ID }}
      CASELEDGER_ENTRA_CLIENT_ID: ${{ vars.CASELEDGER_ENTRA_CLIENT_ID }}
      CASELEDGER_ENTRA_AUTO_PROVISION_ANALYST: ${{ vars.CASELEDGER_ENTRA_AUTO_PROVISION_ANALYST }}
      CASELEDGER_ENTRA_BOOTSTRAP_ADMIN_OBJECT_ID: ${{ vars.CASELEDGER_ENTRA_BOOTSTRAP_ADMIN_OBJECT_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
      IMAGE_SHA_INPUT: ${{ inputs.image_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate deployment inputs
        shell: bash
        env:
          HAS_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD != '' }}
          HAS_SEED_ADMIN_PASSWORD: ${{ secrets.CASELEDGER_SEED_ADMIN_PASSWORD != '' }}
          HAS_SEED_ANALYST_PASSWORD: ${{ secrets.CASELEDGER_SEED_ANALYST_PASSWORD != '' }}
          HAS_ENTRA_CLIENT_SECRET: ${{ secrets.CASELEDGER_ENTRA_CLIENT_SECRET != '' }}
        run: |
          set -euo pipefail
          image_sha="${IMAGE_SHA_INPUT:-}"
          if [[ -z "$image_sha" ]]; then
            image_sha="$GITHUB_SHA"
          fi
          if [[ ! "$image_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'image_sha must be a lowercase 40-character commit SHA.' >&2
            exit 1
          fi
          if [[ -z "${RESOURCE_GROUP:-}" ]]; then
            echo 'The protected Azure environment requires an AZURE_RESOURCE_GROUP variable.' >&2
            exit 1
          fi
          if [[ "$HAS_POSTGRES_ADMIN_PASSWORD" != 'true' ]]; then
            echo 'The protected Azure environment requires a PostgreSQL password secret.' >&2
            exit 1
          fi
          authentication_mode="${CASELEDGER_AUTHENTICATION_MODE:-}"
          if [[ "$authentication_mode" != 'Entra' && "$authentication_mode" != 'Demo' && "$authentication_mode" != 'DemoAndEntra' ]]; then
            echo 'CASELEDGER_AUTHENTICATION_MODE must explicitly be Entra, Demo, or DemoAndEntra.' >&2
            exit 1
          fi
          demo_enabled='false'
          entra_enabled='false'
          if [[ "$authentication_mode" == 'Demo' || "$authentication_mode" == 'DemoAndEntra' ]]; then
            demo_enabled='true'
          fi
          if [[ "$authentication_mode" == 'Entra' || "$authentication_mode" == 'DemoAndEntra' ]]; then
            entra_enabled='true'
          fi
          if [[ "$demo_enabled" == 'true' && ( "$HAS_SEED_ADMIN_PASSWORD" != 'true' || "$HAS_SEED_ANALYST_PASSWORD" != 'true' ) ]]; then
            echo 'Demo authentication requires two protected seed-password secrets.' >&2
            exit 1
          fi
          entra_auto_provision="${CASELEDGER_ENTRA_AUTO_PROVISION_ANALYST:-false}"
          if [[ "$entra_auto_provision" != 'true' && "$entra_auto_provision" != 'false' ]]; then
            echo 'CASELEDGER_ENTRA_AUTO_PROVISION_ANALYST must be true or false.' >&2
            exit 1
          fi
          if [[ "$entra_enabled" != 'true' && "$entra_auto_provision" == 'true' ]]; then
            echo 'Analyst auto-provisioning cannot be enabled while Entra authentication is disabled.' >&2
            exit 1
          fi
          if [[ "$entra_enabled" == 'true' ]]; then
            guid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
            if [[ ! "$CASELEDGER_ENTRA_TENANT_ID" =~ $guid_pattern || ! "$CASELEDGER_ENTRA_CLIENT_ID" =~ $guid_pattern || "$HAS_ENTRA_CLIENT_SECRET" != 'true' ]]; then
              echo 'Enabled Entra authentication requires tenant/client GUID variables and a protected client-secret value.' >&2
              exit 1
            fi
            if [[ "$entra_auto_provision" != 'true' && ! "$CASELEDGER_ENTRA_BOOTSTRAP_ADMIN_OBJECT_ID" =~ $guid_pattern ]]; then
              echo 'Entra authentication requires an immutable bootstrap administrator object ID unless tenant-wide Analyst auto-provisioning is explicitly enabled.' >&2
              exit 1
            fi
          fi
          echo "IMAGE_SHA=$image_sha" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/marvelousjade/caseledger:$image_sha" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/marvelousjade/caseledger-audit-worker:$image_sha" >> "$GITHUB_ENV"

          if [[ "$DEPLOYMENT_ENVIRONMENT" == 'prod' ]]; then
            echo 'POSTGRES_SKU_NAME=Standard_D2ds_v5' >> "$GITHUB_ENV"
            echo 'POSTGRES_SKU_TIER=GeneralPurpose' >> "$GITHUB_ENV"
            echo 'POSTGRES_STORAGE_SIZE_GB=64' >> "$GITHUB_ENV"
            echo 'POSTGRES_BACKUP_RETENTION_DAYS=14' >> "$GITHUB_ENV"
            echo 'POSTGRES_HIGH_AVAILABILITY_MODE=Disabled' >> "$GITHUB_ENV"
            echo 'API_MIN_REPLICAS=1' >> "$GITHUB_ENV"
            echo 'API_MAX_REPLICAS=1' >> "$GITHUB_ENV"
            echo 'WORKER_MIN_REPLICAS=1' >> "$GITHUB_ENV"
            echo 'WORKER_MAX_REPLICAS=3' >> "$GITHUB_ENV"
          else
            echo 'POSTGRES_SKU_NAME=Standard_B1ms' >> "$GITHUB_ENV"
            echo 'POSTGRES_SKU_TIER=Burstable' >> "$GITHUB_ENV"
            echo 'POSTGRES_STORAGE_SIZE_GB=32' >> "$GITHUB_ENV"
            echo 'POSTGRES_BACKUP_RETENTION_DAYS=7' >> "$GITHUB_ENV"
            echo 'POSTGRES_HIGH_AVAILABILITY_MODE=Disabled' >> "$GITHUB_ENV"
            echo 'API_MIN_REPLICAS=1' >> "$GITHUB_ENV"
            echo 'API_MAX_REPLICAS=1' >> "$GITHUB_ENV"
            echo 'WORKER_MIN_REPLICAS=1' >> "$GITHUB_ENV"
            echo 'WORKER_MAX_REPLICAS=1' >> "$GITHUB_ENV"
          fi

      - name: Verify published images are anonymously pullable
        shell: bash
        run: |
          set -euo pipefail
          for image in "$API_IMAGE" "$WORKER_IMAGE"; do
            if ! docker pull --quiet "$image" > /dev/null; then
              echo "Published image is missing or is not anonymously pullable: $image" >&2
              exit 1
            fi
            docker image rm "$image" > /dev/null
          done

      - name: Compile Bicep
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      - name: Log in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check resource group
        shell: bash
        run: |
          set -euo pipefail
          exists="$(az group exists --name "$RESOURCE_GROUP")"
          if [[ "$exists" == 'true' ]]; then
            exit 0
          fi
          echo "Resource group '$RESOURCE_GROUP' does not exist. Sign in to the intended subscription and rerun infra/azure/bootstrap-github-oidc.ps1 for this protected environment before dispatching the workflow." >&2
          exit 1

      - name: Preview infrastructure changes
        shell: bash
        env:
          # What-if needs structurally valid secure parameters, not live credentials.
          CASELEDGER_POSTGRES_ADMIN_PASSWORD: PreviewOnly_1!NeverDeployed
          CASELEDGER_SEED_ADMIN_PASSWORD: PreviewOnly_2!NeverDeployed
          CASELEDGER_SEED_ANALYST_PASSWORD: PreviewOnly_3!NeverDeployed
          CASELEDGER_ENTRA_CLIENT_SECRET: PreviewOnly_4!NeverDeployed
        run: |
          set -euo pipefail
          az deployment group what-if \
            --name "caseledger-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/main.bicepparam \
            --parameters \
              environmentName="$DEPLOYMENT_ENVIRONMENT" \
              apiImage="$API_IMAGE" \
              workerImage="$WORKER_IMAGE" \
              postgresSkuName="$POSTGRES_SKU_NAME" \
              postgresSkuTier="$POSTGRES_SKU_TIER" \
              postgresStorageSizeGb="$POSTGRES_STORAGE_SIZE_GB" \
              postgresBackupRetentionDays="$POSTGRES_BACKUP_RETENTION_DAYS" \
              postgresHighAvailabilityMode="$POSTGRES_HIGH_AVAILABILITY_MODE" \
              apiMinReplicas="$API_MIN_REPLICAS" \
              apiMaxReplicas="$API_MAX_REPLICAS" \
              workerMinReplicas="$WORKER_MIN_REPLICAS" \
              workerMaxReplicas="$WORKER_MAX_REPLICAS" \
            --only-show-errors

      - name: Deploy infrastructure
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        env:
          CASELEDGER_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          CASELEDGER_SEED_ADMIN_PASSWORD: ${{ secrets.CASELEDGER_SEED_ADMIN_PASSWORD }}
          CASELEDGER_SEED_ANALYST_PASSWORD: ${{ secrets.CASELEDGER_SEED_ANALYST_PASSWORD }}
          CASELEDGER_ENTRA_CLIENT_SECRET: ${{ secrets.CASELEDGER_ENTRA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          authentication_mode="${CASELEDGER_AUTHENTICATION_MODE:-}"
          if [[ ${#CASELEDGER_POSTGRES_ADMIN_PASSWORD} -lt 16 ]]; then
            echo 'The PostgreSQL administrator password must contain at least 16 characters.' >&2
            exit 1
          fi
          if [[ "$authentication_mode" == 'Demo' || "$authentication_mode" == 'DemoAndEntra' ]]; then
            if [[ ${#CASELEDGER_SEED_ADMIN_PASSWORD} -lt 12 || ${#CASELEDGER_SEED_ANALYST_PASSWORD} -lt 12 ]]; then
              echo 'Demo authentication requires two seed passwords of at least 12 characters.' >&2
              exit 1
            fi
          fi
          if [[ "$authentication_mode" == 'Entra' || "$authentication_mode" == 'DemoAndEntra' ]]; then
            if [[ ${#CASELEDGER_ENTRA_CLIENT_SECRET} -lt 16 ]]; then
              echo 'Entra authentication requires a client secret of at least 16 characters.' >&2
              exit 1
            fi
          fi
          az deployment group create \
            --name "caseledger-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/main.bicepparam \
            --parameters \
              environmentName="$DEPLOYMENT_ENVIRONMENT" \
              apiImage="$API_IMAGE" \
              workerImage="$WORKER_IMAGE" \
              postgresSkuName="$POSTGRES_SKU_NAME" \
              postgresSkuTier="$POSTGRES_SKU_TIER" \
              postgresStorageSizeGb="$POSTGRES_STORAGE_SIZE_GB" \
              postgresBackupRetentionDays="$POSTGRES_BACKUP_RETENTION_DAYS" \
              postgresHighAvailabilityMode="$POSTGRES_HIGH_AVAILABILITY_MODE" \
              apiMinReplicas="$API_MIN_REPLICAS" \
              apiMaxReplicas="$API_MAX_REPLICAS" \
              workerMinReplicas="$WORKER_MIN_REPLICAS" \
              workerMaxReplicas="$WORKER_MAX_REPLICAS" \
            --only-show-errors > deployment.json

      - name: Publish deployment URL
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="$(jq -r '.properties.outputs.apiUrl.value' deployment.json)"
          entra_redirect_uri="$(jq -r '.properties.outputs.entraRedirectUri.value' deployment.json)"
          if [[ ! "$api_url" =~ ^https:// || ! "$entra_redirect_uri" =~ ^https://.+/signin-oidc$ ]]; then
            echo 'Deployment did not return a valid HTTPS API URL.' >&2
            exit 1
          fi
          echo "API_URL=$api_url" >> "$GITHUB_ENV"
          printf '### Azure deployment\n\nApplication: %s\n\nEntra redirect URI: `%s`\n' "$api_url" "$entra_redirect_uri" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check deployed API health
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          health_url="${API_URL%/}/health"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error \
              --output health.json \
              --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 10 \
              "$health_url" || true)"
            if [[ "$status" == '200' ]] && jq -e '.status == "healthy"' health.json > /dev/null 2>&1; then
              echo "API health check passed on attempt $attempt."
              exit 0
            fi
            echo "API health check attempt $attempt returned HTTP ${status:-unreachable}; retrying."
            sleep 10
          done
          echo "API health check did not pass within five minutes: $health_url" >&2
          exit 1

      - name: Remove deployment output
        if: always()
        shell: bash
        run: rm -f deployment.json health.json
