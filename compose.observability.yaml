services:
  app:
    environment:
      OTEL_SERVICE_NAME: caseledger-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local

  observability:
    image: grafana/otel-lgtm:0.29.0
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/caseledger-dashboard.json
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - observability-data:/data
      - ./ops/observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/caseledger.yaml:ro
      - ./ops/observability/caseledger-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/caseledger-dashboard.json:ro

volumes:
  observability-data:
